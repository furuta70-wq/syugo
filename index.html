<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f3ee">
<title>主語を変える。</title>
<style>
:root{--bg:#f3f3ee;--paper:#fffefa;--ink:#172923;--muted:#63746b;--line:#dce3d9;--accent:#087658;--dark:#153f34;--radius:22px;--red:#c7384b;--yellow:#987000;--blue:#2467cc;--green:#158363;--purple:#744ab8}
*{box-sizing:border-box}
html{height:100%;background:var(--bg)}body{margin:0;min-height:100%;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.42;-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid #65bd9f;outline-offset:3px}button:disabled{cursor:default}
.frame{width:min(100% - 44px,1192px);margin-inline:auto}
.screen{display:none}.screen.active{display:block}.screen.enter{animation:screenIn .44s cubic-bezier(.16,1,.28,1) both}.screen.leaving{animation:screenLeave .19s ease-in both}
@keyframes screenIn{from{opacity:0;transform:translateY(19px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes screenLeave{to{opacity:0;transform:translateY(-12px) scale(.987)}}
/* 人数をタップすれば開始。追加操作はない */
#home{padding:clamp(20px,4.5vh,42px) 0 28px}.hero{position:relative;isolation:isolate;overflow:hidden;background:var(--dark);color:#fff;border-radius:25px;min-height:clamp(170px,26vh,230px);display:flex;align-items:center;padding:clamp(22px,4.7vw,53px)}
.hero::after{content:"誰";position:absolute;z-index:-1;right:5%;top:50%;transform:translateY(-53%) rotate(-12deg);color:#bcdf9e;font-weight:900;font-size:clamp(160px,24vw,255px);opacity:.17;line-height:1;pointer-events:none}
.hero h1{margin:10px 0 8px;font-size:clamp(34px,5.1vw,61px);line-height:1.21;letter-spacing:-.064em;font-weight:950}
.start-panel{padding:clamp(23px,3.6vw,36px) clamp(14px,3vw,35px) clamp(22px,3vw,32px);margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:23px;text-align:center}
.start-panel h2{margin:2px 0 0;font-weight:950;letter-spacing:-.03em;font-size:clamp(22px,3vw,30px)}
.count-buttons{margin:25px auto 0;max-width:760px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(7px,1.7vw,15px)}
.count-button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:0;min-height:clamp(92px,11vw,131px);border:0;border-radius:18px;color:#fff;font-size:clamp(41px,5vw,60px);line-height:1;font-weight:950;box-shadow:0 5px 0 #00000020;transition:transform .14s ease,box-shadow .14s ease,filter .14s ease;overflow:hidden}
.count-button::before{content:"";position:absolute;width:120px;height:120px;top:-85px;right:-60px;border-radius:100%;border:12px solid #ffffff20;pointer-events:none}
.count-button .count-unit{font-size:13px;font-weight:900;letter-spacing:.03em;margin-top:9px;opacity:.83}
.count-button:hover{transform:translateY(-3px);filter:brightness(1.035);box-shadow:0 8px 0 #0000001b}.count-button:active,.count-button.picked{transform:translateY(3px) scale(.975);box-shadow:0 2px 0 #00000026}
.count-button[data-count="1"]{background:var(--red)}.count-button[data-count="2"]{background:var(--yellow);color:#fff}.count-button[data-count="3"]{background:var(--blue)}.count-button[data-count="4"]{background:var(--green)}.count-button[data-count="5"]{background:var(--purple)}
/* 話題を上に、主語は舞台の中央に */
#play{padding:20px 0 24px;display:none;flex-direction:column;min-height:100dvh}#play.active{display:flex}
.topline{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:34px;margin-bottom:10px}
.back{border:0;background:none;padding:8px 4px;color:var(--accent);font-size:13px;font-weight:900}.back:hover{text-decoration:underline}

.topic-box{position:relative;flex-shrink:0;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:var(--paper);padding:clamp(16px,2.4vw,27px) clamp(19px,2.7vw,30px);box-shadow:0 3px 0 #dce6da45;transform-origin:center}
.topic-box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}

.topic-title{margin:6px 0 5px;font-size:clamp(23px,3vw,38px);font-weight:950;line-height:1.36;letter-spacing:-.044em;overflow-wrap:anywhere;text-wrap:balance}
.topic-context{margin:0;color:var(--muted);font-size:clamp(12px,1.25vw,14px);line-height:1.48}
.roles{display:grid;grid-template-columns:repeat(var(--num),minmax(0,1fr));gap:clamp(9px,1.35vw,15px);flex:1;min-height:0;max-height:clamp(300px,54dvh,535px);margin-top:14px;align-items:stretch}
.role-card{--card:#c7384b;--text:#fff;--sub:#ffffffcf;position:relative;isolation:isolate;display:flex;justify-content:center;align-items:center;flex-direction:column;min-width:0;min-height:clamp(185px,36vh,420px);padding:32px clamp(8px,1.2vw,20px) 25px;border-radius:22px;background:var(--card);color:var(--text);text-align:center;overflow:hidden;box-shadow:0 3px 0 #0000000c}
.role-card::after{content:"";position:absolute;z-index:-1;width:270px;height:270px;border:23px solid #ffffff16;border-radius:50%;right:-155px;bottom:-165px;pointer-events:none;transform:rotate(-18deg)}
.role-card[data-player="1"]{--card:var(--red)}.role-card[data-player="2"]{--card:var(--yellow);--text:#fff;--sub:#ffffffd9}.role-card[data-player="3"]{--card:var(--blue)}.role-card[data-player="4"]{--card:var(--green)}.role-card[data-player="5"]{--card:var(--purple)}
.player-label{position:absolute;left:clamp(13px,1.5vw,19px);top:clamp(12px,1.5vw,19px);font-size:clamp(12px,1.2vw,14px);letter-spacing:.02em;font-weight:900;color:var(--sub)}
.role-name{font-size:clamp(27px,3.25vw,53px);line-height:1.34;font-weight:950;letter-spacing:-.052em;overflow-wrap:anywhere;word-break:normal;text-wrap:balance;max-width:100%}
.role-name.long{font-size:clamp(23px,2.7vw,42px)}.role-name.very-long{font-size:clamp(19px,2.3vw,35px)}
.roles[data-count="1"]{max-width:820px;width:100%;margin-inline:auto}.roles[data-count="1"] .role-name{font-size:clamp(49px,7.6vw,105px)}.roles[data-count="1"] .role-name.long{font-size:clamp(38px,5.8vw,75px)}.roles[data-count="1"] .role-name.very-long{font-size:clamp(31px,4.4vw,57px)}
.roles[data-count="2"] .role-name{font-size:clamp(34px,5vw,76px)}.roles[data-count="2"] .role-name.long{font-size:clamp(29px,4vw,57px)}.roles[data-count="2"] .role-name.very-long{font-size:clamp(23px,3.2vw,45px)}
/* Two equal, deliberate action buttons with contrasting colors and a large tap area. */
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.3vw,16px);width:min(100%,850px);margin:17px auto 0;flex-shrink:0}
.action{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:12px;min-width:0;min-height:74px;padding:13px 17px;border:0;border-radius:18px;color:#fff;font-size:clamp(17px,1.85vw,22px);font-weight:950;letter-spacing:-.04em;line-height:1.2;transition:transform .16s cubic-bezier(.2,.85,.2,1),filter .16s,box-shadow .16s;box-shadow:0 6px 0 var(--press)}
.action::before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(120deg,#ffffff24,transparent 40%,transparent 70%,#00000015);pointer-events:none}
.action::after{content:"";position:absolute;inset:0;border:1px solid #ffffff1d;border-radius:inherit;pointer-events:none}
.action-primary{--press:#075641;background:#078264}.action-secondary{--press:#243c65;background:#335b91}
.action:hover:not(:disabled){transform:translateY(-3px);filter:brightness(1.06);box-shadow:0 9px 0 var(--press)}
.action:active:not(:disabled){transform:translateY(5px) scale(.99);box-shadow:0 1px 0 var(--press)}
.action:disabled{opacity:.81}.action-icon{display:grid;place-items:center;flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#ffffff20;font-size:25px;line-height:1;font-weight:800}
/* Page arrival, role replacement, and full-topic replacement have distinct rhythms. */
#home .hero,#home .start-panel{transform-origin:center}
#home.enter .hero{animation:homeHero .52s cubic-bezier(.15,1,.27,1) both}
#home.enter .start-panel{animation:homePanel .55s cubic-bezier(.15,1,.27,1) both .055s}
@keyframes homeHero{from{opacity:0;transform:translateY(15px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes homePanel{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.role-card.swap-out .role-name{animation:swapOut .17s cubic-bezier(.45,0,.8,.3) both;animation-delay:var(--delay,0ms)}
.role-card.swap-in .role-name{animation:swapIn .42s cubic-bezier(.15,.93,.25,1) both;animation-delay:var(--delay,0ms)}
.role-card.swap-in::before{content:"";position:absolute;z-index:1;pointer-events:none;inset:0;background:linear-gradient(110deg,transparent 12%,#ffffff32 47%,transparent 82%);transform:translateX(-140%);animation:shine .58s ease-out both;animation-delay:var(--delay,0ms)}
.role-card.reveal{animation:cardRise .48s cubic-bezier(.15,.95,.25,1) both;animation-delay:var(--delay,0ms)}
.topic-box.reveal{animation:topicIn .48s cubic-bezier(.15,.95,.25,1) both}
.topic-box.reveal::after{content:"";position:absolute;pointer-events:none;inset:0;background:linear-gradient(105deg,transparent 15%,#cce7d34a 50%,transparent 85%);transform:translateX(-135%);animation:shine .6s ease-out both}
.topic-box.exit{animation:stageOut .2s cubic-bezier(.55,0,1,.42) both}
.roles.exit .role-card{animation:stageCardOut .2s cubic-bezier(.55,0,1,.42) both;animation-delay:calc(var(--delay,0ms) * .35)}
@keyframes shine{to{transform:translateX(140%)}}
@keyframes swapOut{to{opacity:0;transform:translateY(-21px) scale(.91);filter:blur(2px)}}
@keyframes swapIn{0%{opacity:0;transform:translateY(24px) scale(.92);filter:blur(2px)}72%{opacity:1;transform:translateY(-3px) scale(1.012);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes cardRise{from{opacity:0;transform:translateY(35px) scale(.958)}70%{opacity:1}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes topicIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes stageOut{to{opacity:0;transform:translateY(-18px) scale(.985)}}
@keyframes stageCardOut{to{opacity:0;transform:translateY(-20px) scale(.96)}}
@media(min-width:701px) and (min-height:1020px){#play{padding-top:clamp(30px,6vh,90px)}}
@media(min-width:701px) and (max-width:1020px){.roles[data-count="5"] .role-name{font-size:clamp(21px,2.65vw,30px)}.roles[data-count="5"] .role-name.long{font-size:clamp(19px,2.45vw,26px)}.roles[data-count="5"] .role-name.very-long{font-size:clamp(17px,2.1vw,23px)}}
@media(max-width:700px){
 .frame{width:calc(100% - 28px)}
 #home{padding:17px 0 20px}.hero{border-radius:20px;padding:27px 23px;min-height:175px}.hero::after{right:-44px;font-size:185px}.start-panel{border-radius:19px;padding:24px 12px 27px;margin-top:12px}.count-buttons{gap:7px;margin-top:20px}.count-button{border-radius:12px;min-height:clamp(77px,15vw,97px);font-size:clamp(32px,8vw,48px)}.count-button .count-unit{font-size:10px;margin-top:6px}
 #play{min-height:100dvh;padding:11px 0 max(14px,env(safe-area-inset-bottom))}.topline{min-height:30px;margin-bottom:5px}.back{font-size:12px}
 .topic-box{border-radius:17px;padding:13px 16px 14px}.topic-title{font-size:clamp(20px,5.2vw,30px);line-height:1.33;margin:4px 0}.topic-context{font-size:11px;line-height:1.45}
 .roles{max-height:none;margin-top:9px;gap:8px}.role-card{border-radius:16px;padding:25px 11px 9px;min-height:0}.player-label{left:12px;top:9px;font-size:12px}
 .roles[data-count="3"],.roles[data-count="4"],.roles[data-count="5"]{grid-template-columns:repeat(2,minmax(0,1fr))}
 .roles[data-count="3"] .role-card:last-child,.roles[data-count="5"] .role-card:last-child{grid-column:1 / -1}
 .roles[data-count="3"],.roles[data-count="5"]{grid-template-rows:repeat(2,minmax(0,1fr))}.roles[data-count="5"]{grid-template-rows:repeat(3,minmax(0,1fr))}
 .roles[data-count="4"]{grid-template-rows:repeat(2,minmax(0,1fr))}
 .roles[data-count="3"] .role-name,.roles[data-count="4"] .role-name,.roles[data-count="5"] .role-name{font-size:clamp(22px,5.15vw,32px)}
 .roles[data-count="3"] .role-name.long,.roles[data-count="4"] .role-name.long,.roles[data-count="5"] .role-name.long{font-size:clamp(19px,4.55vw,28px)}
 .roles[data-count="3"] .role-name.very-long,.roles[data-count="4"] .role-name.very-long,.roles[data-count="5"] .role-name.very-long{font-size:clamp(17px,3.85vw,23px)}
 .roles[data-count="1"] .role-name{font-size:clamp(48px,11vw,86px)}.roles[data-count="1"] .role-name.long{font-size:clamp(34px,8vw,60px)}.roles[data-count="1"] .role-name.very-long{font-size:clamp(28px,6.6vw,48px)}
 .roles[data-count="2"] .role-name{font-size:clamp(32px,6.7vw,55px)}.roles[data-count="2"] .role-name.long{font-size:clamp(28px,6vw,48px)}.roles[data-count="2"] .role-name.very-long{font-size:clamp(24px,5vw,39px)}
 .action-row{gap:9px;margin-top:12px}.action{border-radius:14px;min-height:62px;padding:10px 7px;font-size:clamp(13px,3.85vw,18px);gap:6px;box-shadow:0 4px 0 var(--press)}.action-icon{width:26px;height:26px;font-size:20px}
}
@media(max-width:375px){.role-name{letter-spacing:-.06em}.topic-title{font-size:20px}.role-card{padding-left:7px;padding-right:7px}.roles[data-count="3"] .role-name.long,.roles[data-count="4"] .role-name.long,.roles[data-count="5"] .role-name.long{font-size:18px}.roles[data-count="3"] .role-name.very-long,.roles[data-count="4"] .role-name.very-long,.roles[data-count="5"] .role-name.very-long{font-size:16px}.count-button{min-height:75px}.topic-context{font-size:10.5px}}
@media(max-height:680px) and (max-width:700px){.topic-box{padding:10px 14px}.topic-title{font-size:20px;margin:2px 0}.topic-context{line-height:1.32}.topline{margin-bottom:2px}.roles{margin-top:7px;gap:7px}.role-card{padding-top:23px;padding-bottom:6px}.player-label{top:6px;font-size:11px}.action-row{margin-top:8px}.action{min-height:55px}}
@media(max-height:530px) and (orientation:landscape){#play{min-height:100dvh}.topic-box{padding:8px 13px}.topic-title{font-size:21px;margin:2px 0}.topic-context{font-size:11px}.roles{min-height:90px;gap:8px}.role-card{min-height:0}.action-row{margin-top:8px}.action{min-height:42px}}
/* iPad Safariでも視覚的に分かる、GPU向けtransform中心の演出 */
.scene-wipe{position:fixed;z-index:80;pointer-events:none;left:-25vw;top:-25vh;width:150vw;height:150vh;opacity:0;transform:translate3d(-115%,0,0) skewX(-12deg);background:linear-gradient(105deg,transparent 0%,#137e62 28%,#123f32 58%,transparent 90%);will-change:transform}
.scene-wipe.go{animation:sceneWipe .69s cubic-bezier(.44,.03,.33,1) both}
@keyframes sceneWipe{0%{opacity:0;transform:translate3d(-115%,0,0) skewX(-12deg)}9%{opacity:.95}88%{opacity:.95}100%{opacity:0;transform:translate3d(115%,0,0) skewX(-12deg)}}
.count-button.picked{animation:countSelect .29s cubic-bezier(.18,.9,.24,1) both}
@keyframes countSelect{0%{transform:translateY(3px) scale(.97)}55%{transform:translateY(-8px) scale(1.08)}100%{transform:translateY(1px) scale(.99)}}
/* シャッフルの文字送りと、カード全体の着地を明瞭に */
.role-card.rolling{box-shadow:0 0 0 5px #ffffff33 inset,0 9px 25px #00000018;transition:box-shadow .15s}
.role-card.rolling .role-name{animation:slotTick .12s ease-in-out infinite alternate}
@keyframes slotTick{0%{opacity:.62;transform:translate3d(0,-8px,0) scale(.95)}100%{opacity:1;transform:translate3d(0,7px,0) scale(1.025)}}
.role-card.swap-in{animation:cardLand .55s cubic-bezier(.16,.95,.28,1) both;animation-delay:var(--delay,0ms)}
.role-card.swap-in .role-name{animation:roleLand .55s cubic-bezier(.17,1,.25,1) both;animation-delay:var(--delay,0ms)}
.role-card.swap-in::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(107deg,transparent 17%,#ffffff65 45%,transparent 72%);transform:translate3d(-140%,0,0);animation:landingShine .68s cubic-bezier(.25,.7,.3,1) both;animation-delay:var(--delay,0ms)}
@keyframes cardLand{0%{filter:brightness(1.23);transform:translate3d(0,13px,0) scale(.965)}65%{filter:brightness(1.07);transform:translate3d(0,-6px,0) scale(1.013)}100%{filter:brightness(1);transform:translate3d(0,0,0) scale(1)}}
@keyframes roleLand{0%{opacity:0;transform:translate3d(0,32px,0) scale(.85)}68%{opacity:1;transform:translate3d(0,-6px,0) scale(1.035)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes landingShine{0%{transform:translate3d(-140%,0,0)}100%{transform:translate3d(140%,0,0)}}
.role-card.reveal{animation:cardRise .62s cubic-bezier(.12,.95,.23,1) both;animation-delay:calc(95ms + var(--delay,0ms))}
.topic-box.reveal{animation:topicIn .58s cubic-bezier(.15,.95,.26,1) both}
.role-card.swap-out .role-name{animation:roleDepart .18s cubic-bezier(.45,0,.8,.25) both;animation-delay:var(--delay,0ms)}
@keyframes roleDepart{100%{opacity:0;transform:translate3d(0,-30px,0) scale(.83)}}
@keyframes cardRise{0%{opacity:0;transform:translate3d(0,43px,0) scale(.93)}65%{opacity:1;transform:translate3d(0,-6px,0) scale(1.012)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
@keyframes topicIn{0%{opacity:0;transform:translate3d(0,-19px,0) scale(.975)}78%{opacity:1;transform:translate3d(0,3px,0) scale(1.004)}100%{opacity:1;transform:translate3d(0,0,0) scale(1)}}
/* タップ地点から広がる小さなフィードバック */
.tap-ripple{position:absolute;z-index:3;pointer-events:none;border-radius:50%;width:var(--diameter);height:var(--diameter);left:var(--ripple-x);top:var(--ripple-y);background:#ffffff66;transform:translate(-50%,-50%) scale(.08);animation:tapRipple .52s ease-out both}
@keyframes tapRipple{0%{opacity:.7;transform:translate(-50%,-50%) scale(.08)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
/* 「視差効果を減らす」が有効な端末にのみ、明示的な演出ONの選択肢を表示 */
.motion-option{display:none;border:1px solid #c5d9cc;background:#f9fdf8;color:#1d674b;border-radius:999px;font-size:12px;font-weight:900;padding:5px 10px;min-height:30px}
.motion-option.visible{display:inline-flex;align-items:center;justify-content:center}
.reduce-effects *, .reduce-effects *::before,.reduce-effects *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}


/* V6 — 前版のフェード主体の演出を置き換える、明瞭な画面モーション。 */
.count-button[data-count="2"],.role-card[data-player="2"]{color:#fff!important}
.role-card[data-player="2"]{--sub:#ffffffe6!important}
.count-button[data-count="2"] .count-unit{color:#fff}
.role-card{perspective:850px;transform:translateZ(0);-webkit-transform:translateZ(0);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.role-card .role-name{transform-origin:center center;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;will-change:transform,opacity}
.role-card.reeling{box-shadow:0 5px 0 #0000001a,0 0 0 3px #ffffff44 inset;transition:box-shadow .14s ease-out}
.role-card.reeling::after{animation:ringTurn .5s ease-in-out infinite alternate}
@keyframes ringTurn{to{transform:translate3d(-9px,-16px,0) scale(1.09);opacity:.85}}
.role-card.just-settled::before{content:"";position:absolute;z-index:1;inset:-1px;pointer-events:none;background:linear-gradient(110deg,transparent 15%,#ffffff00 20%,#ffffff9e 45%,#ffffff05 65%,transparent 77%);transform:translateX(-120%);animation:cardGlint .47s cubic-bezier(.22,.7,.25,1) both}
@keyframes cardGlint{to{transform:translateX(120%)}}
.transition-iris{position:fixed;top:0;left:0;z-index:100;pointer-events:none;width:160px;height:160px;border-radius:50%;opacity:0;transform:translate3d(-50%,-50%,0) scale(0);background:#153f34;will-change:transform,opacity;contain:paint}
/* 連続クリックによる連打も状態が分かるように、凹みのあるボタンの手触りは保持。 */
.action:disabled{opacity:.93;filter:saturate(.92)}
/* OS側で動きを減らしているときは非点滅の短い切り替えにする。 */
.reduce-effects .role-card.reeling::after,.reduce-effects .role-card.just-settled::before{animation:none!important}


/* V7: Information hierarchy — no English kicker, tagline, topic counter, or player count badge. */
#play.active{justify-content:center}
#home.active{display:flex;flex-direction:column;justify-content:center}
#home{min-height:100dvh;padding:clamp(20px,4vh,48px) 0;gap:clamp(14px,2vh,22px)}
.hero{min-height:clamp(205px,28dvh,292px);padding:clamp(28px,4.5vw,54px)}
.hero h1{margin:0;position:relative;z-index:1;font-size:clamp(36px,5.2vw,65px);line-height:1.25}
.start-panel{margin-top:0;padding-top:clamp(27px,3.6vw,43px);padding-bottom:clamp(28px,3.6vw,43px)}
.start-panel h2{margin:0}
.topline{justify-content:flex-start;min-height:36px;margin-bottom:12px}
.topic-box{padding:clamp(22px,2.7vw,32px) clamp(22px,2.8vw,34px)}
.topic-title{margin:0 0 9px;font-size:clamp(25px,3.1vw,40px);line-height:1.32}
.topic-context{font-size:clamp(12px,1.3vw,15px);line-height:1.5}
.roles{margin-top:15px}
@media(max-width:700px){
 #home{padding:clamp(16px,3.7vh,34px) 0;gap:13px}
 .hero{min-height:clamp(165px,25dvh,235px);padding:25px 24px}
 .hero h1{font-size:clamp(31px,7.8vw,43px);line-height:1.27}
 .start-panel{padding:clamp(23px,3.8vh,33px) 11px clamp(24px,3.8vh,33px)}
 .topline{min-height:31px;margin-bottom:7px}
 .topic-box{padding:16px 17px}
 .topic-title{font-size:clamp(21px,5.25vw,30px);margin:0 0 6px;line-height:1.32}
 .topic-context{font-size:11px;line-height:1.47}
 .roles{margin-top:10px}
}
@media(max-width:375px){
 .hero h1{font-size:clamp(29px,8.5vw,33px)}
 .topic-box{padding:13px 15px}
 .topic-title{font-size:20px}
}
@media(max-height:680px) and (max-width:700px){
 .hero{min-height:150px}
 .topic-box{padding:12px 15px}
 .topic-title{margin-bottom:4px}
 .roles{margin-top:7px}
}
@media(max-height:530px) and (orientation:landscape){
 #home{justify-content:flex-start}
 .hero{min-height:120px}
 .topic-box{padding:10px 15px}
 .topic-title{font-size:21px;margin-bottom:4px}
}

</head>

const TOPICS=[{"id":"uniform","q":"学校の制服は必要か？","s":"制服を続けるか、私服も選べるようにするか。学校で見直しが始まりました。","a":["junior","parent"],"roles":["me","pastMe","futureMe","elementary","junior","high","uni","teacher","parent","classmate","school","japanese","british","indian"],"compare":["junior","teacher"]},{"id":"homework","q":"毎日の宿題は必要か？","s":"宿題を毎日出す方法と、自分で家庭学習の計画を立てる方法が提案されています。","a":["junior","teacher"],"roles":["me","pastMe","futureMe","elementary","junior","high","uni","teacher","parent","classmate","school"],"compare":["junior","parent"]},{"id":"phones","q":"休み時間にスマートフォンを使ってよいか？","s":"学校で使用を認める案が出ていますが、会話や集中力への影響を心配する声もあります。","a":["junior","teacher"],"roles":["me","pastMe","futureMe","elementary","junior","high","teacher","parent","classmate","school","majority","minority"],"compare":["junior","parent"]},{"id":"ai","q":"学校の課題で、AIに任せてよいことはどこまでか？","s":"調べ物や文章作成の補助には便利ですが、自分で考える学習との関係が問われています。","a":["junior","teacher"],"roles":["me","futureMe","olderMe","junior","high","uni","teacher","classmate","school","japanese","futureHuman"],"compare":["teacher","futureHuman"]},{"id":"grade_eval","q":"生徒の学力は、何を基準に評価するべきか？","s":"発表や作品、授業への取り組みを、筆記テストとともに評価する案が出ています。","a":["junior","teacher"],"roles":["me","pastMe","futureMe","elementary","junior","high","uni","teacher","classmate","school","majority","minority"],"compare":["junior","teacher"]},{"id":"festival_vote","q":"文化祭の出し物は多数決で決めるべきか？","s":"クラスで人気の高い案と、少人数が強く希望する案が競り合っています。","a":["majority","minority"],"roles":["me","futureMe","junior","high","teacher","parent","classmate","school","majority","minority"],"compare":["majority","minority","classmate"]},{"id":"speech","q":"授業で全員に口頭発表を求めるべきか？","s":"考えを伝える練習になる一方、人前で話すことが難しい生徒もいます。","a":["junior","teacher"],"roles":["me","pastMe","futureMe","elementary","junior","high","uni","teacher","classmate","school","majority","minority"],"compare":["junior","teacher"]},{"id":"school_lunch","q":"学校の給食は、全員同じメニューでよいか？","s":"食物アレルギーや食習慣などに合わせて、別の食事を用意する方法もあります。","a":["parent","foreignResident"],"roles":["me","elementary","junior","high","teacher","parent","school","japanese","indian","british","foreignResident","asian","baby"],"compare":["indian","foreignResident","teacher"]},{"id":"school_start","q":"学校の始業時刻を9時にするべきか？","s":"朝の睡眠時間は増えるかもしれませんが、放課後や家庭の予定も変わります。","a":["junior","parent"],"roles":["me","pastMe","futureMe","elementary","junior","high","uni","teacher","parent","classmate","school","worker","baby"],"compare":["junior","worker"]},{"id":"leaves_school","q":"校庭の落ち葉は、すべて片づけるべきか？","s":"掃除を楽にし安全を保ちたい一方、落ち葉は土や生き物にも関わっています。","a":["worm","classmate"],"roles":["elementary","junior","teacher","classmate","school","plants","worm","wildlife","earth","futureHuman"],"compare":["worm","teacher","plants"]},{"id":"group_vs_me","q":"クラスの決定と自分の希望が違うとき、どちらを優先すべきか？","s":"クラスで決まった役割が、あなたのやりたいこととは違う場合です。","a":["me","classmate"],"roles":["me","pastMe","futureMe","junior","high","teacher","classmate","school","majority","minority","parent"],"compare":["me","classmate","majority"]},{"id":"anonymous","q":"ネット上で匿名の発言を認めるべきか？","s":"匿名なら話しやすいこともありますが、発言への責任が問われます。","a":["minority","politician"],"roles":["me","futureMe","olderMe","junior","high","uni","teacher","politician","majority","minority","japanese","british","indian"],"compare":["majority","minority"]},{"id":"honest","q":"友達の作品への率直な感想は、どう伝えるべきか？","s":"友達から率直な感想を求められました。努力して作った作品です。","a":["me","futureMe"],"roles":["me","pastMe","futureMe","olderMe","junior","high","uni","teacher","parent","classmate","majority","minority"],"compare":["me","teacher"]},{"id":"unanimous","q":"全員が納得するまで、話し合いを続けるべきか？","s":"クラスの話し合いは長引いています。早く決めたい人もいます。","a":["minority","classmate"],"roles":["me","junior","high","teacher","classmate","school","majority","minority","politician","futureMe"],"compare":["majority","minority"]},{"id":"challenge","q":"失敗する可能性が高くても、挑戦するべきか？","s":"成功が難しい目標に挑戦するか、確実にできることに取り組むか迷っています。","a":["me","olderMe"],"roles":["me","pastMe","futureMe","olderMe","elementary","junior","high","uni","parent","teacher","senior","ceo"],"compare":["pastMe","olderMe"]},{"id":"past_choice","q":"過去の自分の失敗を、やり直せるならやり直すべきか？","s":"その失敗から得た経験もあります。それでも別の選択をしたいでしょうか。","a":["pastMe","futureMe"],"roles":["me","pastMe","futureMe","olderMe","junior","high","uni","senior","teacher"],"compare":["pastMe","olderMe"]},{"id":"now_or_later","q":"今の楽しみと将来の準備、どちらを優先したいか？","s":"今日の時間を趣味に使うか、未来のための勉強に使うか迷っています。","a":["me","olderMe"],"roles":["me","pastMe","futureMe","olderMe","elementary","junior","high","uni","senior"],"compare":["pastMe","futureMe","olderMe"]},{"id":"future_path","q":"進路は家族の期待より、自分の希望を優先すべきか？","s":"周囲に勧められた進路と、自分が選びたい進路が違っています。","a":["me","parent"],"roles":["me","pastMe","futureMe","olderMe","junior","high","uni","parent","teacher","ceo"],"compare":["me","parent"]},{"id":"effort_result","q":"成果と努力の過程、どちらを重く評価すべきか？","s":"発表会で、結果がよかった班と、試行錯誤を重ねた班がありました。","a":["junior","teacher"],"roles":["me","junior","high","uni","teacher","parent","classmate","school","majority","minority","futureMe","ceo"],"compare":["junior","teacher"]},{"id":"copy_majority","q":"自分だけ反対のとき、どう行動するべきか？","s":"クラスで人気の案に疑問がありますが、反対するのは自分だけかもしれません。","a":["me","minority"],"roles":["me","pastMe","futureMe","junior","high","uni","teacher","classmate","school","majority","minority"],"compare":["majority","minority"]},{"id":"work_four","q":"給料を維持したまま週休3日制を導入すべきか？","s":"人を増やす費用や仕事の進め方も考えながら、休日を増やす提案です。","a":["worker","ceo"],"roles":["me","futureMe","olderMe","uni","worker","ceo","parent","senior","japanese","british","indian","futureHuman"],"compare":["worker","ceo"]},{"id":"night_hours","q":"深夜まで営業する店を減らすべきか？","s":"買い物は不便になりますが、夜遅くまで働く人の負担を減らせるかもしれません。","a":["worker","ceo"],"roles":["uni","worker","ceo","parent","senior","rural","tourist","baby","japanese","futureMe"],"compare":["worker","ceo","baby"]},{"id":"self_checkout","q":"店のレジを無人化してもよいか？","s":"人手不足の解消が期待されますが、機械の操作や働く人への影響もあります。","a":["ceo","blind"],"roles":["futureMe","olderMe","uni","worker","ceo","senior","blind","wheelchair","tourist","baby"],"compare":["worker","ceo","senior"]},{"id":"green_goods", let count=0,topic=null,roles=[],topicDeck=[],lastTopic=null,busy=false,picking=false;

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=random(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function nextTopic(){
 if(!topicDeck.length){topicDeck=shuffle(TOPICS.map(t=>t.id));if(topicDeck.length>1&&topicDeck[topicDeck.length-1]===lastTopic){[topicDeck[0],topicDeck[topicDeck.length-1]]=[topicDeck[topicDeck.length-1],topicDeck[0]]}}
 const id=topicDeck.pop();lastTopic=id;return TOPICS.find(t=>t.id===id)
}
// 各話題の候補から抽選。価値ある立場の対比を優先しつつ、ランダム性を維持する。
const ROLE_ELIGIBILITY=Object.fromEntries(Object.keys(ROLE).map(id=>[id,TOPICS.filter(t=>t.roles.includes(id)).length]));
const ROLE_SHOWN=Object.fromEntries(Object.keys(ROLE).map(id=>[id,0]));
function drawRoles(t,n,old=[]){
 const pool=t.roles,prev=new Set(old),anchor=t.a,compare=t.compare||[];
 const maxFresh=old.length?Math.min(n,pool.filter(id=>!prev.has(id)).length):0;
 let best=null,bestScore=-Infinity;
 for(let trial=0;trial<62;trial++){
  const result=[],picked=new Set();
  while(result.length<n){
   const freshSoFar=result.filter(id=>!prev.has(id)).length;
   const mustBeFresh=old.length&&maxFresh-freshSoFar>=n-result.length;
   const avail=pool.filter(id=>!picked.has(id)&&(!mustBeFresh||!prev.has(id)));
   const weights=avail.map(id=>{
    let w=.85+Math.random()*.4;
    if(!prev.has(id))w*=old.length?3.3:1;
    if(anchor.includes(id))w*=old.length?1.3:1.6;
    w*=Math.pow(.78,result.filter(x=>ROLE[x][1]===ROLE[id][1]).length);
    w*=Math.pow(18/ROLE_ELIGIBILITY[id],.68);
    w/=Math.pow(1+ROLE_SHOWN[id]*.12,.65);
    return w;
   });
   let at=Math.random()*weights.reduce((a,b)=>a+b,0),index=0;
   for(;index<avail.length-1;index++){at-=weights[index];if(at<=0)break}
   result.push(avail[index]);picked.add(avail[index]);
  }
  const perm=shuffle(result);
  const fresh=perm.filter(id=>!prev.has(id)).length;
  const anchorCount=perm.filter(id=>anchor.includes(id)).length;
  const sameSeat=perm.filter((id,i)=>id===old[i]).length;
  const cats=new Set(perm.map(id=>ROLE[id][1])).size;
  const countryCount=perm.filter(id=>compare.includes(id)).length;
  const bonus=(compare.length>=2&&n>=3)?Math.min(countryCount,2)*2.3+(n>=5&&countryCount>=3?.7:0):0;
  const fairness=perm.reduce((sum,id)=>sum+Math.log(Math.max(.2,18/ROLE_ELIGIBILITY[id]))*1.3-Math.log(1+ROLE_SHOWN[id])*.55,0);
  const score=(old.length?fresh*4.0:0)+cats*.42+Math.min(anchorCount,n>=4?2:1)*(old.length?.26:1.5)-sameSeat*3+fairness+bonus+Math.random()*2.1-(old.length===0&&n>=2&&anchorCount===0?7.5:0);
  if(score>bestScore){bestScore=score;best=perm}
 }

}

// ボタンの中心から円が広がり、覆った瞬間に内容を入れ替える。WebKit向けtransformで処理。
async function irisTransition(source,color,replace,reveal){
 if(reduced()||typeof $('transitionIris').animate!=='function'){
  replace();return;
 }
 const ir=$('transitionIris'),b=source&&source.getBoundingClientRect?source.getBoundingClientRect():null;
 const x=b?b.left+b.width/2:window.innerWidth/2,y=b?b.top+b.height/2:window.innerHeight/2;
 const r=Math.max(Math.hypot(x,y),Math.hypot(window.innerWidth-x,y),Math.hypot(x,window.innerHeight-y),Math.hypot(window.innerWidth-x,window.innerHeight-y));
 const scale=Math.max(1,(r+90)/80);
 ir.style.left=x+'px';ir.style.top=y+'px';ir.style.background=color;
 ir.style.opacity='1';
 // アニメーション終了時の見た目をstyleとして保持してからfillを解除する。
 const a=ir.animate([{transform:'translate3d(-50%,-50%,0) scale(.015)',opacity:1},{transform:`translate3d(-50%,-50%,0) scale(${scale})`,opacity:1}],{duration:430,easing:'cubic-bezier(.32,.02,.13,1)',fill:'forwards'});
 try{await a.finished}catch(_e){};
 ir.style.transform=`translate3d(-50%,-50%,0) scale(${scale})`;a.cancel();
 replace();
 if(reveal)reveal();
 await animate(ir,[{opacity:1},{opacity:0}],{duration:365,easing:'cubic-bezier(.2,.65,.3,1)'});
 ir.style.opacity='0';ir.style.transform='translate3d(-50%,-50%,0) scale(0)';
}

}
function revealHome(){
 if(reduced()||typeof document.querySelector('.hero').animate!=='function')return;
 [['.hero',0],['.start-panel',95]].forEach(([sel,delay])=>{
  const el=document.querySelector(sel);
  el.animate([{opacity:0,transform:'translate3d(0,28px,0) scale(.975)'},{opacity:1,transform:'translate3d(0,0,0) scale(1)'}],{duration:510,delay,easing:'cubic-bezier(.16,.92,.24,1)'});
 });
}
async function begin(n){
 if(picking||busy||n<1||n>5)return;
 picking=true;const btn=document.querySelector(`.count-button[data-count="${n}"]`);
 if(!reduced()&&typeof btn.animate==='function')btn.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-7px) scale(1.10)',offset:.48},{transform:'translateY(1px) scale(.97)'}],{duration:285,easing:'ease-out'});
 await sleep(reduced()?0:110);
 await irisTransition(btn,getComputedStyle(btn).backgroundColor,()=>{
  count=n;topicDeck=[];lastTopic=null;freshTopic();view('play');
 },revealPlay);
 picking=false;
}
async function changeTopic(){
 if(busy)return;
 lock(true);
 await irisTransition($('rerollTopic'),'#294e80',freshTopic,revealPlay);
 lock(false);
}
// 文字を縦方向に回転させる「めくり」式。途中候補は同じ話題の候補群から選ぶ。
async function spinCard(card,id,i){
 const el=card.querySelector('.role-name');
 await sleep(i*68);
 if(reduced()||typeof el.animate!=='function'){updateRoleName(el,id);return}
 const choices=shuffle(topic.roles.filter(x=>x!==id&&x!==roles[i])).slice(0,2).concat(id);
 card.classList.add('reeling');
 // 最初は勢いよく、最後の主語だけは明瞭に、ゆっくり止める。
 for(let k=0;k<choices.length;k++){
  await animate(el,[{opacity:1,transform:'perspective(650px) rotateX(0deg) translate3d(0,0,0)'},{opacity:0,transform:'perspective(650px) rotateX(-78deg) translate3d(0,-25px,0)'}],{duration:k===2?115:72,easing:'cubic-bezier(.55,.04,.72,.45)'});
  el.style.opacity='0';
  updateRoleName(el,choices[k]);
  const last=k===choices.length-1;
  await animate(el,[{opacity:0,transform:'perspective(650px) rotateX(73deg) translate3d(0,31px,0)',filter:'blur(2px)'},{opacity:1,transform:'perspective(650px) rotateX(-5deg) translate3d(0,-3px,0)',filter:'blur(0px)',offset:last?.73:.9},{opacity:1,transform:'perspective(650px) rotateX(0deg) translate3d(0,0,0)',filter:'blur(0px)'}],{duration:last?245:96,easing:last?'cubic-bezier(.16,.95,.2,1)':'ease-out'});
  el.style.opacity='';
 }
 card.classList.remove('reeling');
 card.classList.remove('just-settled');void card.offsetWidth;card.classList.add('just-settled');
 card.animate([{transform:'translate3d(0,0,0) scale(.975)'},{transform:'translate3d(0,-7px,0) scale(1.032)',offset:.48},{transform:'translate3d(0,0,0) scale(1)'}],{duration:300,easing:'cubic-bezier(.15,.95,.2,1)'});
 setTimeout(()=>card.classList.remove('just-settled'),515);
}
async function changeRoles(){
 if(busy||!topic)return;
 lock(true);
 const fresh=drawRoles(topic,count,roles),cards=[...$('roles').children];
 // 主語だけを切り替え、話題とカード色は固定。
 await Promise.all(cards.map((card,i)=>spinCard(card,fresh[i],i)));
 roles=fresh;
 lock(false);
}
async function back(){
 if(busy||picking||!$('play').classList.contains('active'))return;
 lock(true);
 await irisTransition($('back'),'#153f34',()=>view('home'),revealHome);
 lock(false);
}
function setup(){
 document.querySelectorAll('.count-button').forEach(b=>b.addEventListener('click',()=>begin(Number(b.dataset.count))));
 $('rerollRoles').addEventListener('click',changeRoles);
 $('rerollTopic').addEventListener('click',changeTopic);
 $('back').addEventListener('click',back);
 document.addEventListener('keydown',e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  if($('home').classList.contains('active')&&/^[1-5]$/.test(e.key)){begin(Number(e.key));return}
  if(!$('play').classList.contains('active')||e.target.closest('button,input'))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();changeRoles()}
  else if(e.key.toLowerCase()==='t'){changeTopic()}
  else if(e.key==='Escape'){back()}
 });
}
setup();
</script>
